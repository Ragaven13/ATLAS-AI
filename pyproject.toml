[project]
name = "atlas-ai"
version = "0.1.0"
description = "ATLAS AI Enterprise Intelligence Platform — documentation-first starter"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
  "polars>=1.0,<3",
  "duckdb>=1.1,<2",
  "pyarrow>=17,<25",
  "pandas>=2.2,<3",
  "pydantic>=2.9,<3",
  "pandera>=0.20,<1",
  "deltalake>=0.22,<2",
  "python-dotenv>=1,<2",
  "rich>=13,<15",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<10",
  "pytest-cov>=5,<8",
  "ruff>=0.7,<1",
  "mypy>=1.11,<2",
]
documents = [
  "docling>=2,<3",
  "presidio-analyzer>=2.2,<3",
  "presidio-anonymizer>=2.2,<3",
]
orchestration = [
  "apache-airflow>=3,<4",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
